<div class="card">
  <div class="card-body">
    <h3>Add new language</h3>
    <div class="input-group">
      <input
        class="form-control"
        placeholder="Name"
        [(ngModel)]="newLanguage.name"
      />
      <input
        class="form-control"
        placeholder="Code"
        [(ngModel)]="newLanguage.code"
      />
      <input
        class="form-control"
        placeholder="Crowdin code"
        [(ngModel)]="newLanguage['crowdin-code']"
      />
      <div class="input-group-append">
        <div class="input-group-text">
          <input
            type="checkbox"
            id="new-language-force-language-name"
            [(ngModel)]="newLanguage['force-language-name']"
          />
          <label class="mb-0 ml-1" for="new-language-force-language-name">
            Force language name
          </label>
        </div>
        <button (click)="createLanguage()" class="btn btn-success">Save</button>
      </div>
    </div>
    <ngb-alert type="info" [dismissible]="false" *ngIf="saving">
      Saving...
    </ngb-alert>
    <ngb-alert type="success" [dismissible]="false" *ngIf="success">
      Success!
    </ngb-alert>
  </div>
</div>
<ngb-alert type="danger" [dismissible]="false" *ngIf="errorMessage">
  {{ errorMessage }}
</ngb-alert>
<ngb-alert type="warning" [dismissible]="false" *ngIf="loading">
  Loading...
</ngb-alert>
<div class="container mt-3">
  <div class="row font-weight-bold">
    <div class="col">Language</div>
    <div class="col">Code</div>
    <div class="col">Crowdin code</div>
    <div class="col">Force language name</div>
    <div class="col-2 text-right">Actions</div>
  </div>

  <div *ngFor="let language of languages">
    <div class="row align-items-center" *ngIf="!language.isEditing">
      <div class="col">
        {{ language.name }}
      </div>
      <div class="col">
        {{ language.code }}
      </div>
      <div class="col">
        {{ language['crowdin-code'] }}
      </div>
      <div class="col">
        <input
          type="checkbox"
          attr.aria-label="Force language name for {{ language.name }}"
          [checked]="language['force-language-name']"
          disabled
        />
      </div>
      <div class="col-2 text-right">
        <button
          (click)="editLanguage(language)"
          class="btn btn-secondary btn-sm"
        >
          Edit
        </button>
        <button
          (click)="showConfirmButton(language)"
          class="btn btn-danger btn-sm"
        >
          Delete
        </button>
      </div>
    </div>
    <div class="row align-items-center" *ngIf="language.isEditing">
      <div class="col">
        <input
          class="form-control form-control-sm"
          placeholder="Name"
          [(ngModel)]="editedLanguage.name"
        />
      </div>
      <div class="col">
        {{ language.code }}
      </div>
      <div class="col">
        <input
          class="form-control form-control-sm"
          placeholder="Crowdin code"
          [(ngModel)]="editedLanguage['crowdin-code']"
        />
      </div>
      <div class="col">
        <input
          type="checkbox"
          attr.aria-label="Force language name for {{ language.name }}"
          [(ngModel)]="editedLanguage['force-language-name']"
        />
      </div>
      <div class="col-2 text-right">
        <button
          (click)="updateLanguage(editedLanguage)"
          class="btn btn-success btn-sm"
          [disabled]="saving"
        >
          Save
        </button>
        <button
          (click)="cancelEdit(language)"
          class="btn btn-secondary btn-sm"
          [disabled]="saving"
        >
          Cancel
        </button>
      </div>
    </div>
    <div class="row">
      <div class="col">
        <ngb-alert
          type="danger"
          [dismissible]="false"
          *ngIf="language.canConfirmDelete"
        >
          Are you sure you want to delete {{ language.name }}?
          <div class="btn-group" role="group">
            <button (click)="deleteLanguage(language)" class="btn btn-dark">
              Confirm
            </button>
            <button
              (click)="language.canConfirmDelete = !language.canConfirmDelete"
              class="btn btn-secondary"
            >
              Cancel
            </button>
          </div>
        </ngb-alert>
      </div>
    </div>
  </div>
</div>
